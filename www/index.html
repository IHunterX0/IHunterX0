<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Düzen: üstte HUD şeridi; okuyucuda solda içindekiler rayı + ortada sakin okuma sütunu; lab ekranları tam HUD. Tek, bilinçli koyu görünüm. */
:root {
  color-scheme: dark;
  --zemin: #060c11;
  --zemin-2: #0a141c;
  --panel: #0d1a24;
  --panel-2: #112330;
  --cizgi: rgba(88, 214, 255, .16);
  --cizgi-guclu: rgba(88, 214, 255, .42);
  --metin: #d6e5ec;
  --metin-sonuk: #8aa2af;
  --metin-cok-sonuk: #5d7682;
  --vurgu: #4fe0ff;
  --vurgu-koyu: #0b8fb0;
  --isik: 0 0 0 1px rgba(79, 224, 255, .25), 0 0 18px rgba(79, 224, 255, .12);
  --iyi: #5fe0a0;
  --uyari: #ffb547;
  --kotu: #ff6b7a;
  --secim: rgba(79, 224, 255, .16);
  --f-baslik: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-govde: "Literata", Georgia, "Times New Roman", serif;
  --f-kod: "JetBrains Mono", Consolas, ui-monospace, monospace;
  --okuma: 1.06rem;
  --r: 6px;
}
* { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; }
body { margin: 0; background: var(--zemin); color: var(--metin); font: 15px/1.5 var(--f-baslik); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--zemin-2); }
a { color: var(--vurgu); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.gizli-erisim { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- üst şerit ---------- */
.serit { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: linear-gradient(180deg, var(--zemin-2), rgba(10, 20, 28, .94));
  border-bottom: 1px solid var(--cizgi); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.serit-ic { display: flex; align-items: center; gap: 10px; min-height: 52px; max-width: 1400px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--metin); font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.logo-halka { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--vurgu); box-shadow: var(--isik); display: grid; place-items: center; font-size: 10px; color: var(--vurgu); }
.logo small { color: var(--metin-sonuk); font-weight: 500; letter-spacing: .12em; font-size: 11px; text-transform: uppercase; }
.sekmeler { display: flex; gap: 2px; margin-left: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { background: none; border: 1px solid transparent; border-radius: var(--r); padding: 6px 10px; color: var(--metin-sonuk); cursor: pointer; white-space: nowrap;
  letter-spacing: .05em; font-size: 13px; text-transform: uppercase; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; }
.sekme:hover { color: var(--metin); border-color: var(--cizgi); }
.sekme[aria-current="page"] { color: var(--vurgu); border-color: var(--cizgi-guclu); background: rgba(79, 224, 255, .06); }
.sekme .rozet { background: var(--vurgu); color: #02141a; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 700; }
.ikon-dugme { background: var(--panel); border: 1px solid var(--cizgi); border-radius: var(--r); min-width: 40px; height: 40px; display: inline-grid; place-items: center; cursor: pointer; color: var(--metin); padding: 0 10px; }
.ikon-dugme:hover { border-color: var(--cizgi-guclu); color: var(--vurgu); }
.ikon-dugme svg { width: 18px; height: 18px; }

/* ---------- genel ---------- */
main { min-height: calc(100% - 53px); }
.sayfa { max-width: 1200px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-baslik); text-wrap: balance; }
.ust-etiket { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--vurgu); }
.dugme { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: var(--r); cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--cizgi-guclu); color: var(--metin); letter-spacing: .04em; text-decoration: none; font-size: 14px; }
.dugme:hover { box-shadow: var(--isik); color: var(--vurgu); }
.dugme.ana { background: linear-gradient(180deg, #13a9cc, #0b7f9c); border-color: #4fe0ff; color: #001319; font-weight: 600; }
.dugme.ana:hover { color: #001319; filter: brightness(1.1); }
.dugme.kucuk { min-height: 34px; padding: 0 10px; font-size: 13px; }
.dugme[disabled] { opacity: .45; cursor: not-allowed; }
.cip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cizgi); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer;
  background: transparent; color: var(--metin-sonuk); min-height: 34px; }
.cip[aria-pressed="true"] { color: var(--metin); border-color: var(--c, var(--vurgu)); background: color-mix(in srgb, var(--c, var(--vurgu)) 14%, transparent); }
.cip .nokta { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--vurgu)); }
.bos { color: var(--metin-sonuk); padding: 32px; text-align: center; border: 1px dashed var(--cizgi); border-radius: var(--r); }
.yukleniyor { color: var(--metin-sonuk); padding: 24px; display: flex; gap: 10px; align-items: center; }
.yukleniyor::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--cizgi-guclu); border-top-color: var(--vurgu); border-radius: 50%; animation: don 0.9s linear infinite; }
@keyframes don { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--cizgi-guclu);
  border-radius: var(--r); padding: 10px 16px; z-index: 100; box-shadow: var(--isik); max-width: calc(100vw - 32px); }

/* ---------- kütüphane ---------- */
.kahraman { display: grid; gap: 6px; margin-bottom: 22px; }
.kahraman h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); font-weight: 600; letter-spacing: .02em; }
.kahraman p { margin: 0; color: var(--metin-sonuk); max-width: 62ch; }
.hizli { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 26px; }
.kart-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.kitap-kart { position: relative; background: linear-gradient(160deg, var(--panel), var(--zemin-2)); border: 1px solid var(--cizgi); border-radius: 10px; padding: 18px; display: grid; gap: 12px; min-width: 0; overflow: hidden; }
.kitap-kart::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--k); box-shadow: 0 0 14px var(--k); }
.kitap-kart:hover { border-color: color-mix(in srgb, var(--k) 55%, transparent); }
.kitap-kart h2 { margin: 0; font-size: 21px; font-weight: 600; }
.kitap-kart .alt { color: var(--metin-sonuk); font-size: 13px; }
.sayilar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sayi { border: 1px solid var(--cizgi); border-radius: var(--r); padding: 8px; text-align: center; }
.sayi b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; color: var(--k); }
.sayi span { font-size: 11px; color: var(--metin-sonuk); letter-spacing: .08em; text-transform: uppercase; }
.cubuk { height: 6px; background: rgba(255, 255, 255, .06); border-radius: 3px; overflow: hidden; }
.cubuk > i { display: block; height: 100%; background: var(--k, var(--vurgu)); box-shadow: 0 0 10px var(--k, var(--vurgu)); }
.kart-alt { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--metin-sonuk); }

/* ---------- okuyucu ---------- */
.okuyucu { display: grid; grid-template-columns: 300px minmax(0, 1fr); max-width: 1400px; margin: 0 auto; }
.ray { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); height: calc(100vh - 53px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-right: 1px solid var(--cizgi);
  padding: 14px 10px 40px max(12px, env(safe-area-inset-left, 0px)); scrollbar-width: thin; }
.ray h3 { margin: 4px 6px 10px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--metin-sonuk); }
.ray-bolum { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 8px 8px; cursor: pointer; color: var(--metin-sonuk); font-size: 13.5px; line-height: 1.35; }
.ray-bolum:hover { background: rgba(79, 224, 255, .05); color: var(--metin); }
.ray-bolum[aria-current="true"] { color: var(--vurgu); background: rgba(79, 224, 255, .07); }
.ray-bolum .ilerle { display: block; height: 2px; margin-top: 6px; background: rgba(255, 255, 255, .06); }
.ray-bolum .ilerle i { display: block; height: 100%; background: var(--k, var(--vurgu)); }
.ray-alt { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px 5px 20px; color: var(--metin-cok-sonuk); font-size: 12.5px; cursor: pointer; border-left: 1px solid var(--cizgi); margin-left: 10px; }
.ray-alt:hover { color: var(--metin); }
.ray-alt.okundu { color: var(--metin-sonuk); }
.ray-alt.okundu::after { content: " ✓"; color: var(--iyi); }
.ray-alt.burada { color: var(--vurgu); border-left-color: var(--vurgu); }
.okuma-alani { min-width: 0; padding-block: 0 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.arac-cubugu { position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); z-index: 20; background: rgba(6, 12, 17, .93); backdrop-filter: blur(6px); border-bottom: 1px solid var(--cizgi);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; margin-bottom: 8px; }
.arac-cubugu .ayrac { flex: 1; }
.arac-cubugu .kitap-adi { font-size: 13px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 520px) { .arac-cubugu { flex-wrap: nowrap; gap: 6px; } .arac-cubugu .uzun { display: none; } .arac-cubugu .ikon-dugme { min-width: 38px; padding: 0 8px; } }
.filtre-panel { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 14px; border-bottom: 1px solid var(--cizgi); margin-bottom: 8px; }
.metin { max-width: 72ch; margin: 0 auto; font-family: var(--f-govde); font-size: var(--okuma); line-height: 1.72; }
.metin h1 { font-size: 1.75em; line-height: 1.2; margin: 1.2em 0 .4em; font-weight: 600; }
.metin h2 { font-size: 1.3em; margin: 2em 0 .5em; padding-top: .4em; border-top: 1px solid var(--cizgi); font-weight: 600; color: #e9f4f8; scroll-margin-top: 120px; }
.metin h3 { font-size: 1.08em; margin: 1.5em 0 .4em; font-weight: 600; color: #cfe3ea; }
.metin h4 { font-size: 1em; margin: 1.2em 0 .3em; }
.metin p { margin: .7em 0; }
.metin strong { color: #f1f8fb; font-weight: 600; }
.metin ul, .metin ol { padding-left: 1.4em; }
.metin li { margin: .25em 0; }
.blok { scroll-margin-top: 120px; }
.blok.parla { animation: parla 2.2s ease-out; }
@keyframes parla { 0% { background: rgba(79, 224, 255, .25); } 100% { background: transparent; } }
.tablo-kap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--cizgi); border-radius: var(--r); }
.metin table { border-collapse: collapse; font-size: .9em; line-height: 1.45; min-width: 100%; }
.metin th, .metin td { border-bottom: 1px solid var(--cizgi); padding: 7px 10px; text-align: left; vertical-align: top; }
.metin th { font-family: var(--f-baslik); font-weight: 600; color: var(--vurgu); background: rgba(79, 224, 255, .05); font-size: .92em; letter-spacing: .02em; }
.metin pre, .kod { font-family: var(--f-kod); font-size: .8em; line-height: 1.5; background: #03080c; border: 1px solid var(--cizgi); border-radius: var(--r); padding: 10px 12px; overflow-x: auto; white-space: pre; }
.kod { display: block; margin: .5em 0; white-space: pre; }
code { font-family: var(--f-kod); font-size: .88em; }
.capraz { color: var(--vurgu); text-decoration: none; border-bottom: 1px dotted var(--vurgu); cursor: pointer; }
.capraz:hover { background: rgba(79, 224, 255, .1); }

/* callout */
.co { --c: var(--vurgu); position: relative; margin: 1.2em 0; padding: 12px 16px 12px 18px; border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
  border-left: 3px solid var(--c); border-radius: 0 var(--r) var(--r) 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 9%, transparent), color-mix(in srgb, var(--c) 3%, transparent)); }
.co-ust { display: flex; align-items: center; gap: 8px; font-family: var(--f-baslik); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--c); margin-bottom: 4px; }
.co > .co-ic > :first-child { margin-top: 0; }
.co > .co-ic > :last-child { margin-bottom: 0; }
.okuyucu.gizle-hepsi .metin > .alt-bolum > .blok:not(.co):not(.baslik-blok) { display: none; }

/* soru widget */
.soru-kutu .varyant { border-top: 1px dashed color-mix(in srgb, var(--c) 35%, transparent); padding-top: 10px; margin-top: 10px; }
.soru-kutu .varyant:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.var-etiket { font-family: var(--f-baslik); font-size: 12.5px; color: var(--metin-sonuk); letter-spacing: .04em; }
.siklar { display: grid; gap: 6px; margin: 8px 0; }
.sik { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; background: rgba(255, 255, 255, .02); border: 1px solid var(--cizgi); border-radius: var(--r);
  padding: 8px 10px; cursor: pointer; font-family: var(--f-govde); font-size: .95em; line-height: 1.45; min-height: 42px; color: var(--metin); }
.sik:hover { border-color: var(--cizgi-guclu); }
.sik .harf { font-family: var(--f-baslik); font-weight: 700; color: var(--vurgu); min-width: 1.2em; }
.sik.dogru { border-color: var(--iyi); background: rgba(95, 224, 160, .1); }
.sik.yanlis { border-color: var(--kotu); background: rgba(255, 107, 122, .1); }
.sik[disabled] { cursor: default; }
.cevap-bolumu { margin-top: 10px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
.onem { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--uyari); letter-spacing: 0; text-transform: none; }
.etiket-kucuk { font-family: var(--f-baslik); font-size: 11px; letter-spacing: .06em; border: 1px solid var(--cizgi); border-radius: 4px; padding: 1px 6px; color: var(--metin-sonuk); }
.etiket-kucuk.ai { color: #c8a6ff; border-color: rgba(200, 166, 255, .4); }

/* figür */
.figurler { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin: 1em 0; }
.figurler.tek { grid-template-columns: minmax(0, 560px); justify-content: center; }
.figur { margin: 0; border: 1px solid var(--cizgi); border-radius: var(--r); overflow: hidden; background: #f4f6f7; cursor: zoom-in; position: relative; }
.figur img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: contain; background: #fff; }
.figur figcaption { font-family: var(--f-baslik); font-size: 12px; padding: 6px 9px; background: var(--panel); color: var(--metin-sonuk); line-height: 1.35; }
.figur figcaption b { color: var(--vurgu); font-weight: 600; }

/* galeri */
.isik-kutu { position: fixed; inset: 0; z-index: 90; background: rgba(2, 6, 9, .96); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.ik-ust, .ik-alt { display: flex; gap: 8px; align-items: center; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); }
.ik-ust { padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--cizgi); }
.ik-alt { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--cizgi); flex-wrap: wrap; }
.ik-sahne { overflow: auto; display: grid; place-items: center; touch-action: pan-x pan-y pinch-zoom; }
.ik-sahne img { max-width: 100%; max-height: 100%; background: #fff; transition: width .15s; }
.ik-sahne.buyuk img { max-width: none; max-height: none; width: 200%; }
.ik-baslik { flex: 1; min-width: 0; font-size: 13.5px; }
.ik-baslik small { display: block; color: var(--metin-sonuk); }
.serit-kucuk { display: flex; gap: 6px; overflow-x: auto; width: 100%; padding-bottom: 4px; }
.serit-kucuk img { height: 54px; width: auto; border: 1px solid var(--cizgi); border-radius: 4px; cursor: pointer; background: #fff; opacity: .55; }
.serit-kucuk img[aria-current="true"] { opacity: 1; border-color: var(--vurgu); }

/* arama */
.arama-kap { position: fixed; inset: 0; z-index: 80; background: rgba(2, 6, 9, .82); backdrop-filter: blur(3px); padding: calc(60px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.arama-kutu { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--cizgi-guclu); border-radius: 10px; box-shadow: var(--isik); display: grid; grid-template-rows: auto auto minmax(0, 1fr); max-height: calc(100vh - 90px); }
.arama-satir { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--cizgi); }
.arama-satir input { flex: 1; min-width: 0; background: var(--zemin); border: 1px solid var(--cizgi); border-radius: var(--r); color: var(--metin); padding: 0 12px; height: 44px; font: 16px var(--f-baslik); }
.arama-ayar { display: flex; gap: 6px; padding: 8px 12px; flex-wrap: wrap; align-items: center; color: var(--metin-sonuk); font-size: 12.5px; }
.sonuclar { overflow-y: auto; padding: 4px 6px 10px; }
.sonuc { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 9px 10px; cursor: pointer; color: var(--metin); }
.sonuc:hover, .sonuc:focus-visible { background: rgba(79, 224, 255, .07); }
.sonuc small { color: var(--metin-sonuk); display: block; font-size: 11.5px; letter-spacing: .04em; }
.sonuc span { font-family: var(--f-govde); font-size: 14px; line-height: 1.45; }
mark { background: rgba(255, 181, 71, .3); color: #ffe2b0; border-radius: 2px; padding: 0 1px; }
.sonuc-grup { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--vurgu); padding: 12px 10px 4px; }

.cekmece-dugme { display: none; }
@media (max-width: 900px) {
  .okuyucu { grid-template-columns: minmax(0, 1fr); }
  .ray { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; height: auto; width: min(86vw, 340px); background: var(--zemin-2); transform: translateX(-102%); transition: transform .2s;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); box-shadow: 0 0 40px rgba(0, 0, 0, .6); }
  .ray.acik { transform: none; }
  .cekmece-dugme { display: inline-grid; }
  .logo small { display: none; }
  .sekme .yazi { display: none; }
  .sekme { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* ---------- Aşama 2: tıklama, panel, sohbet, ekleme ---------- */
.cumle { cursor: pointer; border-radius: 3px; transition: background .15s; text-decoration-color: transparent; }
.cumle:hover, .cumle:focus-visible { text-decoration: underline; text-decoration-color: rgba(79, 224, 255, .45); text-underline-offset: 4px; outline: none; }
.cumle.secili { background: var(--secim); box-shadow: 0 0 0 2px var(--secim); }
.kavram { cursor: help; border-bottom: 1px dashed rgba(79, 224, 255, .35); }
.kavram:hover { color: var(--vurgu); }
.kavram-baslik { cursor: pointer; }
.okuma-modu .cumle { cursor: auto; text-decoration: none !important; background: none; box-shadow: none; }
.okuma-modu .kavram { cursor: auto; border-bottom: 0; color: inherit; }
.okuma-modu .kavram-baslik { cursor: auto; }
.vurgu-sari { background: rgba(255, 214, 90, .22); } .vurgu-yesil { background: rgba(110, 231, 168, .2); } .vurgu-mavi { background: rgba(108, 199, 255, .2); } .vurgu-pembe { background: rgba(255, 143, 199, .2); }

/* ---------- Aşama 6-7: lab ekranları (tam HUD) ---------- */

.lab-sahne { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(circle at 50% 45%, #0a1a24, #04080b 70%); }

.lab-durum { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.lab-durum:empty { display: none; }
.lab-durum .bos { pointer-events: auto; max-width: 420px; }
.hud-katman { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.hud-halka { position: absolute; left: 0; top: 0; border-radius: 50%; border: 2px solid var(--vurgu); box-shadow: 0 0 18px rgba(79, 224, 255, .55), inset 0 0 12px rgba(79, 224, 255, .3); opacity: 0; transition: opacity .3s; }
.hud-halka::before, .hud-halka::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1px dashed rgba(79, 224, 255, .6); animation: don 6s linear infinite; }
.hud-halka::after { inset: 6px; border: 1px solid rgba(79, 224, 255, .3); animation-direction: reverse; animation-duration: 9s; }
.hud-cizgi { position: absolute; left: 0; top: 0; width: 70px; height: 1px; background: linear-gradient(90deg, var(--vurgu), transparent); transform-origin: 0 0; opacity: 0; transition: opacity .3s; }
.lab-yan { border-left: 1px solid var(--cizgi); overflow-y: auto; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 24px 14px; display: grid; gap: 12px; align-content: start; background: var(--zemin-2); }
.lab-kutu { border: 1px solid var(--cizgi); border-radius: 10px; padding: 12px; background: var(--panel); display: grid; gap: 8px; min-width: 0; }

.tur-adimlar { margin: 0; padding-left: 1.4em; display: grid; gap: 2px; font-size: 13px; max-height: 160px; overflow-y: auto; }
